# Copy to config/local.toml (gitignored).
# Login server: "host" or "host:port" (port defaults to 6900; key optional, defaults to 127.0.0.1:6900).
#   Local server: "127.0.0.1:6900"
#   LAN server:   "192.168.1.50" or "192.168.1.50:6900"
# Override per run with:  --login <addr>  (or --login-addr <addr>)
login_addr = "127.0.0.1:6900"
username = "test"
password = "test"
char_slot = 0
# vulkan | dx12 | gl | metal | auto
backend = "vulkan"
# --headless: seconds to stay on the map after entering
soak_secs = 30
# Installed RO client; its data/ folder and GRFs are read in place.
client_dir = "C:/Gravity/Ragnarok Online"
# event.grf is a DES-encrypted seasonal (Christmas) overlay; leave it out.
grfs = ["data.grf"]
# Optional folders laid over the data, first wins: e.g. an unpacked English translation
# (github.com/llchrisll/ROenglishRE), whose SystemEN files replace System.
# overlays = ["C:/ROenglishRE/Translation/Renewal"]
map = "prontera"
msaa = 4
# Starting volumes (0..1). In-game changes (Alt+O) are saved to settings.toml beside this file.
bgm_volume = 0.5
sfx_volume = 0.7
# Skip the login and character screens: log straight in with username / password /
# char_slot (scripted runs and --capture do this automatically).
auto_login = false
