# Copy to config/local.toml (gitignored).
# Login server: "host" or "host:port" (port defaults to 6900; key optional, defaults to 127.0.0.1:6900).
#   Local server: "127.0.0.1:6900"
#   LAN server:   "192.168.1.50" or "192.168.1.50:6900"
# Override per run with:  --login <addr>  (or --login-addr <addr>)
login_addr = "127.0.0.1:6900"
# rAthena's web-server (Adventurer's Agency party board). Defaults to the login host on
# port 8888; set it when web-server runs elsewhere, e.g. "192.168.1.50:8888".
# web_addr = "127.0.0.1:8888"
# Game Masters: add the GM actions (kick, mute, recall, go to, check stats, ...) to the
# player right-click menu. GM slash commands (/b, /nb, /lb, /nlb, /hide, /mm, /recall,
# /shift, /item, /monster, /rc, /check, /killall, /resetstate, /resetcooltime,
# /changemaptype) work either way; the server checks the account's group permissions.
# gm = true
# Game Master accounts as the original's clientinfo.xml lists them: drawn with the GM sprite
# (<aid>) and with yellow names (<yellow>). A GM can also switch the look on or off for
# everyone with @gmlook (rAthena npc/custom/gm_look.txt; Game Options shows a toggle with
# gm = true), which overrides these lists.
# gm_aids = [2000000]
# yellow_aids = [2000000]
username = "test"
password = "test"
char_slot = 0
# PIN code for auto_login / scripted runs when the server has pincode_enabled (the login
# screens show a PIN pad instead).
# pincode = "2580"
# vulkan | dx12 | gl | metal | auto
backend = "vulkan"
# --headless: seconds to stay on the map after entering
soak_secs = 30
# Installed RO client; its data/ folder and GRFs are read in place.
client_dir = "C:/Gravity/Ragnarok Online"
# event.grf is a DES-encrypted seasonal (Christmas) overlay; leave it out.
grfs = ["data.grf"]
# Optional folders laid over the data, first wins: e.g. an unpacked English translation
# (github.com/llchrisll/ROenglishRE), whose SystemEN files replace System.
# overlays = ["C:/ROenglishRE/Translation/Renewal"]
map = "prontera"
msaa = 4
# Starting volumes (0..1). In-game changes (Alt+O) are saved to settings.toml beside this file.
bgm_volume = 0.5
sfx_volume = 0.7
# Skip the login and character screens: log straight in with username / password /
# char_slot (scripted runs and --capture do this automatically).
auto_login = false
