[package]
name = "ro-render"
edition.workspace = true
version.workspace = true

[dependencies]
anyhow.workspace = true
ro-formats = { path = "../ro-formats" }
bytemuck = { version = "1.25.2", features = ["derive"] }
glam = "0.34.1"
tracing.workspace = true
serde.workspace = true
flate2.workspace = true
wgpu = "30.0.1"
winit = "0.30.13"
egui = "0.37"
egui-wgpu = "0.37"

[dev-dependencies]
# Same naga as wgpu: validates the WGSL in tests and translates it (examples/shaderxlate).
naga = { version = "30.0.1", features = ["wgsl-in", "glsl-out", "hlsl-out", "spv-out"] }
