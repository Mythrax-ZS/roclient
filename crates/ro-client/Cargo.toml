[package]
name = "ro-client"
edition.workspace = true
version.workspace = true

# The client is called Tenseiga; the package keeps its crate name (cargo -p ro-client).
[[bin]]
name = "tenseiga"
path = "src/main.rs"

# Android: the same client as a library the NativeActivity loads (libtenseiga_android.so).
# Empty on other platforms.
[lib]
name = "tenseiga_android"
path = "src/lib.rs"
crate-type = ["cdylib"]

[build-dependencies]
winresource = "0.1"

[dependencies]
flate2.workspace = true
ro-net = { path = "../ro-net" }
ro-render = { path = "../ro-render" }
ro-formats = { path = "../ro-formats" }
ro-vfs = { path = "../ro-vfs" }
ro-game = { path = "../ro-game" }
glam = "0.34.1"
anyhow.workspace = true
pollster.workspace = true
serde.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
winit = "0.30.13"
image = { version = "0.25", default-features = false, features = ["png"] }
egui = { version = "0.37", default-features = false, features = ["default_fonts"] }
egui-winit = { version = "0.37", default-features = false, features = ["clipboard", "links"] }
rodio = { version = "0.23.0", default-features = false, features = ["playback", "mp3", "wav"] }
encoding_rs = "0.8"
gilrs = "0.11.2"
mlua = { version = "0.12.2", features = ["lua51", "vendored"] }
serde_json = "1"
ureq = { version = "3", default-features = false }

[target.'cfg(not(target_os = "android"))'.dependencies]
# Sony and Nintendo pads straight over HID (touchpad, rumble, light); Android has no raw HID.
hidapi = { version = "2.6", default-features = false, features = ["windows-native", "linux-native"] }

[target.'cfg(target_os = "android")'.dependencies]
winit = { version = "0.30.13", features = ["android-native-activity"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging"] }
