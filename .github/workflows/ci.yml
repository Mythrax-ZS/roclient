name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install dev packages
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libx11-dev libxkbcommon-dev libwayland-dev libxrandr-dev libxi-dev libxcursor-dev libxkbcommon-x11-dev libasound2-dev libudev-dev
      - run: cargo test --workspace

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --target x86_64-pc-windows-msvc -p ro-client -p grfdump
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/tenseiga/config | Out-Null
          $t = "target/x86_64-pc-windows-msvc/release"
          Copy-Item "$t/tenseiga.exe","$t/grfdump.exe" dist/tenseiga/
          Copy-Item config/example.toml dist/tenseiga/config/
          Copy-Item README.md dist/tenseiga/
          # The Samurai sprites, icons and quest text; the client finds them beside itself.
          Copy-Item -Recurse overlays dist/tenseiga/
          Compress-Archive -Path dist/tenseiga/* -DestinationPath tenseiga-windows-x86_64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: tenseiga-windows-x86_64.zip

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install dev packages
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libx11-dev libxkbcommon-dev libwayland-dev libxrandr-dev libxi-dev libxcursor-dev libxkbcommon-x11-dev libasound2-dev libudev-dev libfuse2
      - run: cargo build --release -p ro-client -p grfdump
      - name: Build AppImage
        run: |
          mkdir -p AppDir/usr/bin AppDir/usr/share/tenseiga
          cp target/release/tenseiga target/release/grfdump AppDir/usr/bin/
          cp config/example.toml README.md AppDir/usr/share/tenseiga/
          # The Samurai sprites, icons and quest text, at the AppImage root (the client searches upward from usr/bin).
          cp -r overlays AppDir/
          cp packaging/AppRun AppDir/AppRun
          chmod +x AppDir/AppRun
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20250213-2/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage
          export APPIMAGE_EXTRACT_AND_RUN=1 ARCH=x86_64
          # exclude GPU/Vulkan libs: SteamOS provides them
          ./linuxdeploy-x86_64.AppImage --appdir AppDir \
            --executable AppDir/usr/bin/tenseiga \
            --desktop-file packaging/tenseiga.desktop \
            --icon-file packaging/tenseiga.png \
            --exclude-library 'libvulkan*' --exclude-library 'libGL*' --exclude-library 'libEGL*' \
            --exclude-library 'libGLX*' --exclude-library 'libdrm*' --exclude-library 'libgbm*' \
            --exclude-library 'libwayland*' --exclude-library 'libxcb*' --exclude-library 'libX11*' \
            --exclude-library 'libxkbcommon*' --exclude-library 'libasound*' --exclude-library 'libudev*' \
            --output appimage
          # linuxdeploy overwrites AppRun with a symlink only if absent; ensure ours is used
          ls -la *.AppImage
          [ -f tenseiga-x86_64.AppImage ] || mv "$(ls -1 *.AppImage | grep -v linuxdeploy | head -1)" tenseiga-x86_64.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: tenseiga-x86_64.AppImage

  # Android 13+ (API 33), arm64: the client as a NativeActivity library, packed by
  # packaging/android/build_apk.sh with the runner's SDK and NDK.
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-ndk --locked
      - name: Build the library
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          cargo ndk -t arm64-v8a --platform 33 -o apk/lib build --release -p ro-client --lib
          ls -l apk/lib/arm64-v8a
      - name: Build the APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: build-${{ github.run_number }}
        run: sh packaging/android/build_apk.sh apk tenseiga-android-arm64.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: tenseiga-android-arm64.apk

  release:
    # Android is attached when it builds; it doesn't hold back the others.
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.test.result == 'success' && needs.build-windows.result == 'success' && needs.build-linux.result == 'success' }}
    needs: [test, build-windows, build-linux, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Vars
        id: v
        run: |
          S=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "short=$S" >> "$GITHUB_OUTPUT"
          git log -1 --format=%B > body.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}-${{ steps.v.outputs.short }}
          name: Build ${{ github.run_number }} (${{ steps.v.outputs.short }})
          target_commitish: ${{ github.sha }}
          prerelease: true
          body_path: body.txt
          files: |
            artifacts/tenseiga-windows-x86_64.zip
            artifacts/tenseiga-x86_64.AppImage
            artifacts/tenseiga-android-arm64.apk
