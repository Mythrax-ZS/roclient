[workspace]
resolver = "2"
members = ["crates/*", "tools/*"]
exclude = ["tools/samurai_assets", "vendor/android-activity"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
bytes = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures = "0.3"
flate2 = "1"
encoding_rs = "0.8"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
pollster = "0.4"

# Android: android-activity with an input hook for game controllers (vendor/android-activity/TENSEIGA.md).
[patch.crates-io]
android-activity = { path = "vendor/android-activity" }
